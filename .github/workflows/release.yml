name: Release
# Run by hand: Actions tab -> Release -> Run workflow.
# Builds the plugin, regenerates pool/ and index.json, and commits them to main.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npm run build -- --plugins-dir plugins
      - run: npm run lint:types
      - run: npx valenced-plugin generate-index
      - name: Commit release files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pool index.json
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "Release Music Controls 2.1.0" && git push)
